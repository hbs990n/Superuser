name: Build Superuser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout Superuser-master
        uses: actions/checkout@v4
        with:
          path: Superuser-master

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 21
          ndk-version: r25b
          cmdline-tools-version: latest

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Superuser-master/Superuser/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x Superuser-master/Superuser/gradlew

      - name: Build Release APK
        run: |
          cd Superuser-master/Superuser
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Superuser-apk
          path: Superuser-master/Superuser/build/outputs/apk/release/Superuser-release.apk
          retention-days: 7